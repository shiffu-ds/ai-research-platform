[pytest]
# Python suites for M1 (agents), M2 (RAG) and M3 (backend).
# M2 integration tests need the pgvector dev database from
# rag/docker-compose.m2.yml with rag/sql/*.sql applied (DATABASE_URL).
testpaths =
    backend/tests
    tests/m1
    tests/m2
asyncio_default_fixture_loop_scope = function
