services:
  rag-postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: autonomous-ai-rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: rag_dev
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - rag_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_pgdata:
